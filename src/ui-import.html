<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      color: var(--figma-color-text);
      background: var(--figma-color-bg);
      padding: 16px;
      min-height: 100vh;
    }
    
    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--figma-color-border);
    }
    
    .header-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #FB6428 0%, #FF8B5A 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    
    .header-text h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--figma-color-text);
    }
    
    .header-text p {
      font-size: 11px;
      color: var(--figma-color-text-secondary);
      margin-top: 2px;
    }
    
    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      padding: 4px;
      background: var(--figma-color-bg-secondary);
      border-radius: 8px;
    }
    
    .tab {
      flex: 1;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--figma-color-text-secondary);
      background: none;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .tab:hover {
      color: var(--figma-color-text);
      background: var(--figma-color-bg-hover);
    }
    
    .tab.active {
      color: var(--figma-color-text);
      background: var(--figma-color-bg);
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    
    /* Panel */
    .panel {
      display: none;
    }
    
    .panel.active {
      display: block;
    }
    
    /* Section */
    .section {
      margin-bottom: 20px;
    }
    
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--figma-color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }
    
    /* Drop Zone */
    .drop-zone {
      padding: 40px 20px;
      border: 2px dashed var(--figma-color-border);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--figma-color-bg-secondary);
    }
    
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--figma-color-bg-brand);
      background: var(--figma-color-bg-brand-tertiary);
    }
    
    .drop-zone-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }
    
    .drop-zone-text {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    
    .drop-zone-hint {
      font-size: 11px;
      color: var(--figma-color-text-tertiary);
    }
    
    /* File List */
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--figma-color-bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--figma-color-border);
    }
    
    .file-item-icon {
      font-size: 18px;
    }
    
    .file-item-info {
      flex: 1;
    }
    
    .file-item-name {
      font-weight: 500;
      font-size: 12px;
    }
    
    .file-item-size {
      font-size: 10px;
      color: var(--figma-color-text-tertiary);
    }
    
    .file-item-remove {
      width: 24px;
      height: 24px;
      background: none;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: var(--figma-color-text-tertiary);
      font-size: 16px;
      transition: all 0.15s;
    }
    
    .file-item-remove:hover {
      background: var(--figma-color-bg-danger-tertiary);
      color: var(--figma-color-text-danger);
    }
    
    /* Preview */
    .preview {
      padding: 12px;
      background: var(--figma-color-bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--figma-color-border);
      font-family: 'SF Mono', Menlo, Monaco, monospace;
      font-size: 10px;
      max-height: 150px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    
    /* Buttons */
    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    
    .btn {
      flex: 1;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #FB6428 0%, #FF8B5A 100%);
      color: white;
    }
    
    .btn-primary:hover {
      opacity: 0.9;
    }
    
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: var(--figma-color-bg-secondary);
      color: var(--figma-color-text);
      border: 1px solid var(--figma-color-border);
    }
    
    .btn-secondary:hover {
      background: var(--figma-color-bg-hover);
    }
    
    /* Log */
    .log-container {
      margin-top: 16px;
      padding: 12px;
      background: var(--figma-color-bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--figma-color-border);
      max-height: 120px;
      overflow-y: auto;
    }
    
    .log-entry {
      font-size: 11px;
      padding: 4px 0;
      border-bottom: 1px solid var(--figma-color-border);
    }
    
    .log-entry:last-child {
      border-bottom: none;
    }
    
    .log-success { color: #22c55e; }
    .log-error { color: #ef4444; }
    .log-info { color: var(--figma-color-text-secondary); }
    
    /* Status */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
    }
    
    .status.success {
      background: rgba(34, 197, 94, 0.1);
      color: #22c55e;
    }
    
    .status.error {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
    }
    
    /* Generator List */
    .generator-list {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    
    .generator-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: var(--figma-color-bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--figma-color-border);
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .generator-item:hover {
      border-color: var(--figma-color-border-selected);
    }
    
    .generator-item.selected {
      border-color: var(--figma-color-bg-brand);
      background: var(--figma-color-bg-brand-tertiary);
    }
    
    .generator-item input {
      accent-color: var(--figma-color-bg-brand);
    }
    
    .generator-item label {
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    /* Hidden file input */
    #fileInput {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">🎨</div>
    <div class="header-text">
      <h1>DS to Figma</h1>
      <p>Import captured components</p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="import">📥 Import JSON</button>
    <button class="tab" data-tab="generate">⚡ Generators</button>
  </div>

  <!-- Import Panel -->
  <div id="import-panel" class="panel active">
    <div class="section">
      <div class="section-title">Captured Components</div>
      
      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">📁</div>
        <div class="drop-zone-text">Drop JSON files here</div>
        <div class="drop-zone-hint">or click to browse</div>
      </div>
      
      <input type="file" id="fileInput" accept=".json" multiple />
    </div>

    <div id="filesSection" class="section" style="display: none;">
      <div class="section-title">Files to Import</div>
      <div class="file-list" id="fileList"></div>
    </div>

    <div id="previewSection" class="section" style="display: none;">
      <div class="section-title">Preview</div>
      <pre class="preview" id="preview"></pre>
    </div>

    <div class="button-group">
      <button class="btn btn-secondary" id="clearBtn" disabled>Clear</button>
      <button class="btn btn-primary" id="importBtn" disabled>Import to Figma</button>
    </div>

    <div class="log-container" id="logContainer" style="display: none;">
    </div>
  </div>

  <!-- Generate Panel -->
  <div id="generate-panel" class="panel">
    <div class="section">
      <div class="section-title">Hand-crafted Generators</div>
      <div class="generator-list" id="generatorList">
        <div class="generator-item">
          <input type="checkbox" id="gen-button" value="button">
          <label for="gen-button">Button</label>
        </div>
        <div class="generator-item">
          <input type="checkbox" id="gen-input" value="input">
          <label for="gen-input">Input</label>
        </div>
        <div class="generator-item">
          <input type="checkbox" id="gen-badge" value="badge">
          <label for="gen-badge">Badge</label>
        </div>
        <div class="generator-item">
          <input type="checkbox" id="gen-card" value="card">
          <label for="gen-card">Card</label>
        </div>
        <div class="generator-item">
          <input type="checkbox" id="gen-checkbox" value="checkbox">
          <label for="gen-checkbox">Checkbox</label>
        </div>
        <div class="generator-item">
          <input type="checkbox" id="gen-switch" value="switch">
          <label for="gen-switch">Switch</label>
        </div>
        <div class="generator-item">
          <input type="checkbox" id="gen-avatar" value="avatar">
          <label for="gen-avatar">Avatar</label>
        </div>
        <div class="generator-item">
          <input type="checkbox" id="gen-label" value="label">
          <label for="gen-label">Label</label>
        </div>
        <div class="generator-item">
          <input type="checkbox" id="gen-separator" value="separator">
          <label for="gen-separator">Separator</label>
        </div>
      </div>
    </div>

    <div class="button-group">
      <button class="btn btn-secondary" id="selectAllBtn">Select All</button>
      <button class="btn btn-primary" id="generateBtn" disabled>Generate</button>
    </div>
  </div>

  <script>
    // State
    const files = [];
    let currentPreview = null;

    // DOM Elements
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const filesSection = document.getElementById('filesSection');
    const previewSection = document.getElementById('previewSection');
    const preview = document.getElementById('preview');
    const importBtn = document.getElementById('importBtn');
    const clearBtn = document.getElementById('clearBtn');
    const logContainer = document.getElementById('logContainer');

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + '-panel').classList.add('active');
      });
    });

    // Drop zone handlers
    dropZone.addEventListener('click', () => fileInput.click());
    
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });
    
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
    
    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    // Handle files
    function handleFiles(fileList) {
      Array.from(fileList).forEach(file => {
        if (file.name.endsWith('.json')) {
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const data = JSON.parse(e.target.result);
              files.push({
                name: file.name,
                size: file.size,
                data: data
              });
              renderFileList();
            } catch (err) {
              log('error', `Failed to parse ${file.name}: ${err.message}`);
            }
          };
          reader.readAsText(file);
        }
      });
    }

    // Render file list
    function renderFileList() {
      if (files.length === 0) {
        filesSection.style.display = 'none';
        previewSection.style.display = 'none';
        importBtn.disabled = true;
        clearBtn.disabled = true;
        return;
      }

      filesSection.style.display = 'block';
      importBtn.disabled = false;
      clearBtn.disabled = false;

      fileList.innerHTML = files.map((file, index) => `
        <div class="file-item" data-index="${index}">
          <span class="file-item-icon">📄</span>
          <div class="file-item-info">
            <div class="file-item-name">${file.name}</div>
            <div class="file-item-size">${formatSize(file.size)} • ${file.data.layers?.length || 0} layers</div>
          </div>
          <button class="file-item-remove" data-index="${index}">×</button>
        </div>
      `).join('');

      // Click to preview
      fileList.querySelectorAll('.file-item').forEach(item => {
        item.addEventListener('click', (e) => {
          if (e.target.classList.contains('file-item-remove')) return;
          const index = parseInt(item.dataset.index);
          showPreview(files[index]);
        });
      });

      // Remove button
      fileList.querySelectorAll('.file-item-remove').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const index = parseInt(btn.dataset.index);
          files.splice(index, 1);
          renderFileList();
        });
      });

      // Show first file preview
      if (files.length > 0 && !currentPreview) {
        showPreview(files[0]);
      }
    }

    function showPreview(file) {
      previewSection.style.display = 'block';
      currentPreview = file;
      preview.textContent = JSON.stringify(file.data, null, 2).slice(0, 2000) + '...';
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      return (bytes / 1024).toFixed(1) + ' KB';
    }

    // Clear files
    clearBtn.addEventListener('click', () => {
      files.length = 0;
      currentPreview = null;
      renderFileList();
      logContainer.style.display = 'none';
      logContainer.innerHTML = '';
    });

    // Import to Figma
    importBtn.addEventListener('click', () => {
      if (files.length === 0) return;
      
      logContainer.style.display = 'block';
      logContainer.innerHTML = '';
      log('info', `Importing ${files.length} file(s)...`);
      
      // Send all files data to plugin
      const allLayers = [];
      files.forEach(file => {
        if (file.data.layers) {
          allLayers.push(...file.data.layers);
        }
      });

      parent.postMessage({
        pluginMessage: {
          type: 'import-json',
          layers: allLayers,
          fileCount: files.length
        }
      }, '*');
    });

    // Generate panel
    const generateBtn = document.getElementById('generateBtn');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const generatorCheckboxes = document.querySelectorAll('#generatorList input[type="checkbox"]');

    generatorCheckboxes.forEach(cb => {
      cb.addEventListener('change', updateGenerateBtn);
      cb.closest('.generator-item').addEventListener('click', (e) => {
        if (e.target !== cb) {
          cb.checked = !cb.checked;
          updateGenerateBtn();
        }
      });
    });

    function updateGenerateBtn() {
      const selected = Array.from(generatorCheckboxes).filter(cb => cb.checked);
      generateBtn.disabled = selected.length === 0;
      
      generatorCheckboxes.forEach(cb => {
        cb.closest('.generator-item').classList.toggle('selected', cb.checked);
      });
    }

    selectAllBtn.addEventListener('click', () => {
      const allSelected = Array.from(generatorCheckboxes).every(cb => cb.checked);
      generatorCheckboxes.forEach(cb => cb.checked = !allSelected);
      updateGenerateBtn();
    });

    generateBtn.addEventListener('click', () => {
      const selected = Array.from(generatorCheckboxes)
        .filter(cb => cb.checked)
        .map(cb => cb.value);
      
      parent.postMessage({
        pluginMessage: {
          type: 'generate',
          components: selected
        }
      }, '*');
    });

    // Logging
    function log(type, message) {
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      entry.textContent = message;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    // Messages from plugin
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'log') {
        log('info', msg.message);
      } else if (msg.type === 'error') {
        log('error', msg.message);
      } else if (msg.type === 'success') {
        log('success', msg.message);
      } else if (msg.type === 'complete') {
        log('success', `✅ Import complete! Created ${msg.count} nodes`);
      }
    };
  </script>
</body>
</html>
